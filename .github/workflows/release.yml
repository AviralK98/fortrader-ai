name: Release

# Builds and publishes installers when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Publishes the installer and its manifest for each platform. Installed
# copies discover updates through those manifests (latest.yml on Windows,
# latest-mac.yml on macOS), so a release missing one is invisible to
# every existing user of that platform.
#
# PyInstaller cannot cross-compile, so each platform builds its own
# sidecar on its own runner. macOS runs after Windows rather than beside
# it: both jobs publish to the same release, and concurrent creation of
# it is a race.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Required for electron-builder to create the GitHub release.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # electron-updater compares against the version in package.json, not
      # the tag. If they disagree, clients either never see the release or
      # see the wrong version — so fail loudly here instead.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Tag v$tag does not match desktop/package.json version $pkg"
          }
          Write-Host "Version $pkg matches tag."

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      # npm may skip lifecycle scripts, leaving no Electron binary for
      # electron-builder to package.
      - name: Ensure Electron binary
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            Write-Host "Electron binary missing; running its installer."
            node node_modules/electron/install.js
          }

      # A release must never ship code that fails its own tests.
      - name: Run full test suite
        run: |
          python -m pytest
          python -m ruff check .
          python -m mypy backend mcp_bridge
          npm run typecheck
          npm run lint
          npm test

      - name: Build Python sidecar
        run: python -m PyInstaller backend.spec --noconfirm --distpath dist --workpath build

      # A sidecar that builds but cannot start is worse than a build
      # failure: it only surfaces on the user's machine.
      - name: Smoke-test the sidecar
        shell: pwsh
        env:
          FORTRADER_PORT: '8797'
        run: |
          $env:FORTRADER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fortrader-check'
          $proc = Start-Process -PassThru -WindowStyle Hidden `
            -FilePath dist/fortrader-backend/fortrader-backend.exe
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8797/health' -TimeoutSec 2
                if ($health.ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'Sidecar did not answer /health' }
            Write-Host "Sidecar healthy (schema v$($health.schema_version))."
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # The same executable serves the MCP bridge, so a broken --mcp mode
      # would silently disconnect every user's Claude Code.
      - name: Verify the MCP bridge responds
        shell: pwsh
        run: |
          $exe = 'dist/fortrader-backend/fortrader-backend.exe'
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe, '--mcp')
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $p.StandardInput.WriteLine($req)
          $p.StandardInput.Flush()
          $line = $p.StandardOutput.ReadLineAsync()
          if (-not $line.Wait(30000)) { $p.Kill(); throw 'MCP bridge did not respond' }
          $p.Kill()
          if (-not $line.Result) { throw 'MCP bridge returned nothing' }
          Write-Host "MCP bridge responded."

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload installer as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: fortrader-ai-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  macos:
    # Sequential, not parallel: see the note at the top of this file.
    needs: windows
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match desktop/package.json version $pkg"
            exit 1
          fi
          echo "Version $pkg matches tag."

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: |
          if [ ! -d node_modules/electron/dist/Electron.app ]; then
            echo "Electron binary missing; running its installer."
            node node_modules/electron/install.js
          fi

      - name: Run full test suite
        run: |
          python -m pytest
          python -m ruff check .
          python -m mypy backend mcp_bridge
          npm run typecheck
          npm run lint
          npm test

      - name: Build Python sidecar
        run: python -m PyInstaller backend.spec --noconfirm --distpath dist --workpath build

      # As on Windows: a sidecar that builds but cannot start would only
      # surface on a user's machine. macOS has no GNU `timeout`, so the
      # waits here are bounded polling loops.
      - name: Smoke-test the sidecar
        env:
          FORTRADER_PORT: '8797'
        run: |
          export FORTRADER_DATA_DIR="$RUNNER_TEMP/fortrader-check"
          ./dist/fortrader-backend/fortrader-backend &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            sleep 1
            if curl -fsS -m 2 http://127.0.0.1:8797/health > health.json 2>/dev/null; then
              ok=1
              break
            fi
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo 'Sidecar did not answer /health'; exit 1; fi
          echo "Sidecar healthy: $(cat health.json)"

      - name: Verify the MCP bridge responds
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          printf '%s\n' "$req" | ./dist/fortrader-backend/fortrader-backend --mcp > mcp-out.txt &
          pid=$!
          for _ in $(seq 1 30); do
            sleep 1
            [ -s mcp-out.txt ] && break
          done
          kill "$pid" 2>/dev/null || true
          if [ ! -s mcp-out.txt ]; then echo 'MCP bridge did not respond'; exit 1; fi
          echo "MCP bridge responded."

      - name: Build the disk image
        working-directory: desktop
        run: |
          npm run build
          npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Upload disk image as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: fortrader-ai-macos
          path: |
            release/*.dmg
            release/latest-mac.yml
          if-no-files-found: error

  # Publishing is deliberately not electron-builder's job.
  #
  # Its publisher reported success while creating nothing a signed-out
  # visitor could see, and a release nobody can see is indistinguishable
  # from no release at all -- the updater in an installed copy fetches
  # anonymously and gets a 404 either way. Doing it here instead makes
  # the outcome explicit, and the verification step below fails the run
  # rather than letting another silent no-op through.
  publish:
    needs: [windows, macos]
    # Rehearsals build and check; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # The release body is read from docs/release-notes-macos.md below,
      # so the repository has to be present. Nothing else here needs it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artefacts/*/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo 'No artefacts to publish.'
            exit 1
          fi

          echo "Publishing ${#files[@]} files:"
          printf '  %s\n' "${files[@]}"

          # latest.yml is how an installed copy discovers the update. An
          # installer without it is invisible, so refuse to publish a
          # release that would look complete and update nobody.
          case "${files[*]}" in
            *latest.yml*) ;;
            *) echo 'latest.yml is missing; installed copies could not see this release.'; exit 1 ;;
          esac

          # An unsigned macOS build is refused by Gatekeeper with "is
          # damaged and can't be opened", whose only offered action is
          # Move to Bin. Someone who hits that and has not been told why
          # concludes the download is corrupt and leaves. The fix is one
          # command, so it leads the release body.
          notes=docs/release-notes-macos.md

          if [ ! -s "$notes" ]; then
            echo "$notes is missing; every macOS download would look broken."
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release exists; replacing its assets and making sure it is not a draft.'
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

            # --notes-file replaces the body outright, so applying it
            # unconditionally here would delete the generated changelog
            # on every re-run. Prepend instead, and only once.
            body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

            if printf '%s' "$body" | grep -qF 'Installing on macOS'; then
              echo 'Install instructions already present; leaving the body alone.'
            else
              echo 'Prepending install instructions to the existing body.'
              { cat "$notes"; printf '\n'; printf '%s' "$body"; } > combined-notes.md
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file combined-notes.md
            fi
          else
            # GitHub pre-pends a supplied body to the --generate-notes
            # output rather than replacing it, so the changelog follows.
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
          fi

      # Proving it from outside is the whole point: these are the two
      # requests an installed copy actually makes, in order.
      #
      # Checking only that latest.yml exists is not enough, and v0.2.0 is
      # why. Its manifest published fine and named an installer that was
      # not there, because a space in the artifact name is stored by
      # GitHub as a dot and written into the manifest as a dash. The
      # release looked complete from every angle except the one that
      # matters, so the download is now followed all the way.
      - name: Verify an installed copy could actually update
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases"

          for manifest in latest.yml latest-mac.yml; do
            if ! curl -fsSL "$base/latest/download/$manifest" -o "$manifest"; then
              echo "An anonymous fetch of $manifest failed; no installed copy can see this release."
              exit 1
            fi

            name=$(grep -m1 '^path:' "$manifest" | sed 's/^path:[[:space:]]*//' | tr -d '\r')

            if [ -z "$name" ]; then
              echo "$manifest names no installer."
              exit 1
            fi

            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$base/download/$GITHUB_REF_NAME/$name")

            if [ "$code" != "200" ]; then
              echo "$manifest points at '$name', which returns $code."
              echo 'The update would be found and then fail to download.'
              exit 1
            fi

            echo "$manifest -> $name is downloadable."
          done
