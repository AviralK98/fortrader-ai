<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortrader AI</title>
    <script>
      // Applied before first paint. Reading this in React renders one
      // frame in the default palette and then swaps, which reads as a
      // flicker on every launch. Kept deliberately small and in sync
      // with appearance.ts.
      (function () {
        var root = document.documentElement;
        var presets = ['fortrade', 'aurora', 'graphite', 'oled', 'frost', 'paper'];
        var accents = {
          teal: ['#2ee6c5', '#14b8a6'],
          blue: ['#4c9aff', '#2f6fd0'],
          violet: ['#a78bfa', '#7c5cf0'],
          green: ['#35c98b', '#16a06a'],
          amber: ['#f0b429', '#d18f06'],
          rose: ['#fb7185', '#e11d48'],
          indigo: ['#818cf8', '#4f46e5'],
        };
        var radii = { sharp: '4px', soft: '10px', round: '18px' };
        var a = {};

        try {
          a = JSON.parse(localStorage.getItem('fortrader.appearance') || '{}');
        } catch (e) {
          a = {};
        }

        root.dataset.theme =
          presets.indexOf(a.preset) >= 0 ? a.preset : 'fortrade';
        root.dataset.motion = a.motion || 'subtle';
        root.dataset.pointer = a.pointerLight === false ? 'off' : 'on';

        // Falls back to the preset's own accent, matching
        // appearance.ts, so the first frame is never the wrong colour.
        var presetAccent = {
          fortrade: 'blue',
          aurora: 'teal',
          graphite: 'indigo',
          oled: 'violet',
          frost: 'blue',
          paper: 'green',
        };
        var accent =
          accents[a.accent] ||
          accents[presetAccent[root.dataset.theme]] ||
          accents.blue;
        root.style.setProperty('--accent', accent[0]);
        root.style.setProperty('--accent-strong', accent[1]);
        root.style.setProperty('--radius', radii[a.radius] || radii.soft);

        var g = (typeof a.glass === 'number' ? a.glass : 55) / 100;
        root.style.setProperty('--glass-blur', (g * 26).toFixed(1) + 'px');
        root.style.setProperty('--glass-alpha', (0.98 - g * 0.62).toFixed(3));
        root.style.setProperty('--glass-edge', (0.05 + g * 0.16).toFixed(3));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
