# Windows packaging.
#
# Produces "Fortrader AI Setup <version>.exe" (NSIS) containing the
# Electron app plus the PyInstaller-built Python sidecar, so the end user
# installs nothing else — no Python, no Node.
#
# Build everything with:  npm run package:all   (from the repo root)

appId: com.fortraderai.desktop
productName: Fortrader AI
copyright: Copyright © 2026

directories:
  output: ../release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  # Resolved at runtime as process.resourcesPath/backend/fortrader-backend.exe
  # by desktop/main/backend-process.ts.
  - from: ../dist/fortrader-backend
    to: backend
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
  # No spaces. GitHub rewrites a space in an uploaded asset name to a
  # dot, while electron-builder writes the name into latest.yml with
  # dashes, so an installer built as "Fortrader AI Setup 0.2.0.exe" is
  # served as Fortrader.AI.Setup.0.2.0.exe and requested as
  # Fortrader-AI-Setup-0.2.0.exe. The download 404s, the updater gives
  # up quietly, and the release looks fine from the outside.
  artifactName: Fortrader-AI-Setup-${version}.${ext}
  # Single source of truth at the repo root rather than a copy under
  # buildResources, so the two cannot drift. Embedded into the exe and
  # used for the Start Menu and desktop shortcuts.
  icon: ../fortrader-ai.ico
  # Unsigned. Windows SmartScreen will warn on first run until the
  # installer is signed with a real certificate — see docs/development.md.
  signAndEditExecutable: true

mac:
  # Spaces here would break the download exactly as above.
  artifactName: Fortrader-AI-${version}-${arch}.${ext}
  target:
    # Architecture is chosen by scripts/build-mac.sh from `uname -m`
    # rather than pinned here. PyInstaller builds the sidecar for the
    # host architecture only, so the two must always agree — hardcoding
    # arm64 would silently produce an app an Intel Mac cannot run.
    - dmg
  category: public.app-category.finance
  # electron-builder generates the .icns from this at build time, so no
  # macOS-only tooling (iconutil) is needed and there is no generated
  # binary to keep in sync. 1024px is the size macOS wants for Retina.
  icon: ../export/mac/icon_1024x1024.png
  #
  # No Developer ID, so no real signature. `identity: null` stops
  # electron-builder looking for a certificate it will not find.
  #
  # It does NOT mean the app ships unsigned: afterPack applies an ad-hoc
  # signature, which Apple Silicon requires before it will execute a
  # Mach-O at all.
  #
  # That signature does NOT get past Gatekeeper. Ad-hoc identifies
  # nobody, so a *downloaded* build -- which macOS marks with
  # com.apple.quarantine -- is still assessed and still rejected:
  #
  #   codesign --verify --deep --strict App.app   # passes
  #   spctl --assess --type execute App.app       # rejected
  #
  # The user sees "is damaged and can't be opened", offering only Move
  # to Bin, and neither right-click -> Open nor Open Anyway is available
  # to them -- those rescue an app with a real certificate that merely
  # lacks notarisation. Only `xattr -dr com.apple.quarantine` clears it,
  # which is why every download ships with READ ME FIRST.txt below.
  #
  # Fixing it properly needs the Apple Developer Program. See
  # docs/development.md, "Gatekeeper rejects every downloaded build".
  identity: null

dmg:
  # Three icons rather than the default two, so the window is widened and
  # the drag target moved out to match. The read-me sits below the app ->
  # Applications drag path rather than in it.
  window:
    width: 620
    height: 420
  contents:
    # No `path`: electron-builder substitutes the built .app.
    - x: 150
      y: 180
      type: file
    - x: 470
      y: 180
      type: link
      path: /Applications
    # The only thing that reaches a user whose app will not open. The
    # GitHub release notes say the same, but someone who saved the .dmg
    # and came back to it later has no release page in front of them.
    - x: 310
      y: 330
      type: file
      path: ../docs/macos-read-me-first.txt
      name: READ ME FIRST.txt

# Runs for macOS only; see the script for why it is not optional.
afterPack: ./scripts/adhoc-sign.cjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fortrader AI
  installerIcon: ../fortrader-ai.ico
  uninstallerIcon: ../fortrader-ai.ico
  installerHeaderIcon: ../fortrader-ai.ico
  # The browser session and captured candle history live in the user-data
  # directory. Uninstall must not take them: a reinstall would otherwise
  # force a fresh login and re-collection of every chart.
  deleteAppDataOnUninstall: false

# Where installed copies look for updates. electron-builder also writes
# latest.yml into release/, which must be uploaded alongside the installer
# or clients cannot discover the new version.
#
# The download is verified against the SHA512 in that manifest, so a
# corrupted or altered file is rejected. It does NOT prove who published
# it — that needs code signing. Whoever controls this repository's
# releases can ship code to every installed copy.
publish:
  provider: github
  owner: AviralK98
  repo: fortrader-ai
  # electron-builder defaults to `draft`, and a draft is invisible to
  # anyone not signed in with write access to this repository. The
  # updater in an installed copy fetches anonymously, so against a draft
  # it gets a 404 and concludes there is nothing newer -- a release that
  # builds, uploads and reports success while reaching no one.
  releaseType: release

# Speeds up repeat builds and avoids re-downloading Electron each time.
electronDownload:
  cache: .electron-cache
