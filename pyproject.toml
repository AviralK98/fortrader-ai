[project]
name = "fortrader-ai-backend"
version = "0.2.5"
description = "Deterministic market analysis backend for Fortrader AI"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# A captured browser profile is data, not source. It has no tests in it,
# and collection walking into one has already broken the suite once when
# a damaged entry there made the whole run unreadable.
norecursedirs = [
    "*_browser_profile",
    "node_modules",
    "legacy",
    "release",
    "dist",
    "build",
    ".git",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["legacy", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Pydantic/FastAPI dependency-injection defaults trip these.
    "B008",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
exclude = ["legacy/", "build/", "dist/"]

[[tool.mypy.overrides]]
# `anthropic` is optional: the narrative layer degrades to None without
# it, so its absence must not fail a type check.
module = ["uvicorn.*", "pandas.*", "mcp.*", "anthropic.*"]
ignore_missing_imports = true
